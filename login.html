<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DiagLaudos Gestão — Entrar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body class="auth-body">
  <div class="auth-card">
    <img src="logo-diaglaudos.png" alt="DiagLaudos" class="auth-logo">
    <p class="hint">Gestão de laudos, recebimentos e pagamentos de médicos. Entre com sua conta ou crie uma se ainda não tem.</p>

    <form id="loginForm" class="auth-form">
      <label>E-mail <input type="email" id="loginEmail" required></label>
      <label>Senha <input type="password" id="loginSenha" required minlength="6"></label>
      <button type="submit" class="btn-primary">Entrar</button>
    </form>

    <hr>

    <form id="signupForm" class="auth-form">
      <h2>Criar conta (médicos)</h2>
      <label>Nome completo <input type="text" id="signupNome" required></label>
      <label>E-mail <input type="email" id="signupEmail" required></label>
      <label>Senha (mín. 6 caracteres) <input type="password" id="signupSenha" required minlength="6"></label>
      <button type="submit" class="btn-secondary">Criar conta</button>
    </form>
    <p class="hint">Depois de criar a conta, avise a administração para liberar seu acesso aos laudos.</p>

    <p id="authMsg" class="hint"></p>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="lib/supabaseClient.js"></script>
  <script src="login.js"></script>
</body>
</html>
